<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Page not found | CodeSchool in a Box</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1a1a1a;
        --link: #0a4c94;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #ececec;
          --link: #7ab8ff;
        }
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          1.125rem/1.6 system-ui,
          sans-serif;
        margin: 0;
        padding: 4rem 1rem;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--link);
      }
      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 3px;
      }
      @media print {
        :root {
          --bg: #fff;
          --fg: #000;
          --link: #000;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is no page at this address.</p>
      <p><a href="/">Go to the CodeSchool in a Box home page</a></p>
    </main>
  </body>
</html>
